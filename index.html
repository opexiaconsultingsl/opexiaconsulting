<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>OPEXIA CONSULTING | Página en construcción</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0086BF;
            color: white;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            font-size: 42px;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 28px;
            margin-top: 40px;
        }

        p {
            font-size: 18px;
            margin: 10px 0;
        }

        hr {
            width: 70%;
            margin: 25px auto;
            border: 0;
            border-top: 2px solid white;
            opacity: 0.8;
        }

        a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            opacity: 0.8;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>PÁGINA EN CONSTRUCCIÓN</h1>
        <hr>

        <h2>OPEXIA CONSULTING</h2>
        <hr>

        <p>Consultoría de Excelencia Operacional y Automatización</p>

        <br><br>

        <p><strong>Contacto:</strong></p>
        <p>
            <a href="mailto:info@opexiaconsulting.com">
                info@opexiaconsulting.com
            </a>
        </p>

    </div>

</body>
</html>
